name: validation
on:
  push:
  pull_request:
jobs:
  validation:
    name: MGF v1.0 Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -vv -s
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-errors-md
          path: validation-errors.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-errors-json
          path: validation-errors.json
